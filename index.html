<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filmi Charades</title>

 <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <div class="logo">🎬 FILMI CHARADES</div>

    <div class="subtitle">
        FIND YOUR MOVIE TO ACT
    </div>

    <div class="movie-card">

        <div class="hint">
            YOUR MOVIE
        </div>

        <div class="movie-title" id="movieTitle">
            Ready?
        </div>

        <div class="year" id="movieYear">
            🎲 Roll the dice
        </div>

        <div class="actors" id="actors">
            Your movie will appear here
        </div>

    </div>

    <button class="roll-button" onclick="rollMovie()">
        🎲 ROLL DICE
    </button>

    <div class="status" id="status"></div>

    <div class="timer" id="timer"></div>

</div>

<script>

function rollMovie() {

    document.getElementById("movieTitle").textContent =
        "Sholay";

    document.getElementById("movieYear").textContent =
        "1975";

    document.getElementById("actors").innerHTML =
        "👨 Amitabh Bachchan<br>👩 Hema Malini";

    document.getElementById("status").textContent =
        "🎬 GET READY!";

    document.getElementById("timer").textContent =
        "5";

}

</script>

</body>
</html>
